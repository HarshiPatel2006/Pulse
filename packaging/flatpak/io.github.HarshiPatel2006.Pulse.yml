app-id: io.github.HarshiPatel2006.Pulse
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: pulse
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
modules:
  - name: pulse
    buildsystem: simple
    build-commands:
      - install -Dm755 pulse /app/bin/pulse
    sources:
      - type: file
        path: ../../dist/pulse-linux-amd64
