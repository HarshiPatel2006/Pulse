name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - name: Build
        shell: bash
        run: GOOS=${{ matrix.goos }} GOARCH=amd64 CGO_ENABLED=${{ matrix.goos == 'windows' && '0' || '1' }} go build -trimpath -ldflags='-s -w' -o Pulse-${{ matrix.goos }}-amd64${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-${{ matrix.goos }}-amd64
          path: Pulse-${{ matrix.goos }}-amd64${{ matrix.ext }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
